<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ubuy – Login / Sign Up</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <div class="card" role="main">

        <div class="tabs" role="tablist" aria-label="Authentication mode">
            <button class="tab-btn" id="tab-login" role="tab" aria-selected="false" aria-controls="panel-login"
                onclick="switchTab('login')">Log In</button>

            <button class="tab-btn active" id="tab-signup" role="tab" aria-selected="true" aria-controls="panel-signup"
                onclick="switchTab('signup')">Sign Up</button>
        </div>

        <section id="panel-login" class="form-panel" role="tabpanel" aria-labelledby="tab-login">
            <form novalidate onsubmit="handleLogin(event)">

                <div class="field">
                    <label for="login-email">Email Address <span aria-hidden="true">*</span></label>
                    <input type="email" id="login-email" name="email" placeholder="you@example.com" required
                        autocomplete="email" aria-required="true" />
                </div>

                <div class="method-row">
                    <div class="method-group" role="group" aria-label="Authentication method">
                        <button type="button" class="method-btn active" id="login-pw-btn" aria-pressed="true"
                            onclick="switchLoginMethod('password')">Password</button>
                        <button type="button" class="method-btn" id="login-otp-btn" aria-pressed="false"
                            onclick="switchLoginMethod('otp')">OTP</button>
                    </div>

                    <div class="field method-input" id="login-pw-field">
                        <div class="pw-wrap">
                            <input type="password" id="login-password" name="password" placeholder="Password *" required
                                autocomplete="current-password" aria-required="true" aria-label="Password" />
                            <button type="button" class="toggle-pw" aria-label="Show password"
                                onclick="togglePw('login-password', this)">
                                <i class="fa-regular fa-eye" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>

                    <div class="field method-input" id="login-otp-field" style="display:none;">
                        <input type="text" id="login-otp" name="otp" placeholder="OTP *" maxlength="6"
                            inputmode="numeric" pattern="[0-9]{4,6}" aria-label="One-time password" />
                    </div>
                </div>

                <a href="#" class="aux-link" id="login-aux-link">Forgot Your Password?</a>

                <button type="submit" class="btn-primary" style="margin-top:20px;">Login</button>

                <div class="social-bar" role="group" aria-label="Social login options">
                    <span class="social-icon" aria-label="Google">
                        <i class="fa-brands fa-google"></i>
                    </span>
                    <span class="social-icon" aria-label="Facebook">
                        <i class="fa-brands fa-facebook"></i>
                    </span>
                    <span class="social-icon" aria-label="Apple">
                        <i class="fa-brands fa-apple"></i>
                    </span>
                    <span class="social-icon" aria-label="PayPal">
                        <i class="fa-brands fa-paypal"></i>
                    </span>
                    <span>Login with Social Accounts</span>
                </div>
            </form>
        </section>

        <section id="panel-signup" class="form-panel visible" role="tabpanel" aria-labelledby="tab-signup">
            <form novalidate onsubmit="handleSignup(event)">

                <div class="field">
                    <label for="signup-email">Email Address <span aria-hidden="true">*</span></label>
                    <input type="email" id="signup-email" name="email" placeholder="you@example.com" required
                        autocomplete="email" aria-required="true" />
                </div>

                <div class="method-row">
                    <div class="method-group" role="group" aria-label="Authentication method">
                        <button type="button" class="method-btn active" id="signup-otp-btn" aria-pressed="true"
                            onclick="switchSignupMethod('otp')">OTP</button>
                        <button type="button" class="method-btn" id="signup-pw-btn" aria-pressed="false"
                            onclick="switchSignupMethod('password')">Password</button>
                    </div>

                    <div class="field method-input" id="signup-otp-field">
                        <input type="text" id="signup-otp" name="otp" placeholder="OTP *" maxlength="6"
                            inputmode="numeric" pattern="[0-9]{4,6}" aria-label="One-time password"
                            aria-required="true" />
                    </div>

                    <div class="field method-input" id="signup-pw-field" style="display:none;">
                        <div class="pw-wrap">
                            <input type="password" id="signup-password" name="password" placeholder="Password *"
                                autocomplete="new-password" aria-label="Password" />
                            <button type="button" class="toggle-pw" aria-label="Show password"
                                onclick="togglePw('signup-password', this)">
                                <i class="fa-regular fa-eye" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <a href="#" class="aux-link" id="signup-aux-link" onclick="handleGetOtp(event)">Get OTP ?</a>

                <div class="recaptcha-box" role="group" aria-label="CAPTCHA verification">
                    <input type="checkbox" id="recaptcha-check" aria-label="I'm not a robot" />
                    <label class="recaptcha-label" for="recaptcha-check">I'm not a robot</label>
                    <div class="recaptcha-logo" aria-hidden="true">
                        <i class="fa-solid fa-shield-halved" style="font-size: 2rem; color: #4A90D9;"></i>
                        <span>reCAPTCHA</span>
                        <span style="font-size:.55rem;color:#aaa;">Privacy · Terms</span>
                    </div>
                </div>

                <div class="check-row">
                    <input type="checkbox" id="mailing-list" name="mailing" />
                    <label for="mailing-list">
                        Join Our Mailing List – Get updates on Rollbacks, special pricing,
                        hot new items, gift ideas and more.
                    </label>
                </div>

                <button type="submit" class="btn-primary">Register</button>

                <p class="disclaimer">
                    By continuing, you agree to Ubuy's
                    <a href="#" onclick="return false;">Terms and Conditions</a>
                </p>


                <div class="social-bar" role="group" aria-label="Social login options">
                    <span class="social-icon" aria-label="Google">
                        <i class="fa-brands fa-google"></i>
                    </span>
                    <span class="social-icon" aria-label="Facebook">
                        <i class="fa-brands fa-facebook"></i>
                    </span>
                    <span class="social-icon" aria-label="Apple">
                        <i class="fa-brands fa-apple"></i>
                    </span>
                    <span class="social-icon" aria-label="PayPal">
                        <i class="fa-brands fa-paypal"></i>
                    </span>
                    <span>Login with Social Accounts</span>
                </div>

            </form>
        </section>

    </div>

    <script src="script.js"></script>

</body>

</html>
